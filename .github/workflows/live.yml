name: Live providers

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      stockx_browser:
        description: Also check StockX using visible Chrome on macOS
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-providers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  http-providers:
    name: Live HTTP providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # StockX has a separate desktop-browser check below.
      STOCKX_CHROME_PATH: /nonexistent/browser-not-enabled-for-http-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start API and verify live catalog, prices, and validation
        shell: bash
        run: |
          set -euo pipefail
          node build/server.js > live-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat live-api.log
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://localhost:4000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat live-api.log; exit 1; fi
          npm run test:live 2>&1 | tee live-check.log
      - name: Save live-check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-http-logs
          path: |
            live-api.log
            live-check.log
          if-no-files-found: ignore
          retention-days: 7

  stockx-browser:
    name: Live StockX browser
    if: github.event_name == 'workflow_dispatch' && inputs.stockx_browser
    runs-on: macos-15
    timeout-minutes: 15
    env:
      REQUIRE_STOCKX: '1'
      STOCKX_CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start API and require live StockX prices
        shell: bash
        run: |
          set -euo pipefail
          node build/server.js > live-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat live-api.log
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://localhost:4000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat live-api.log; exit 1; fi
          npm run test:live 2>&1 | tee live-check.log
      - name: Save browser-check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-stockx-logs
          path: |
            live-api.log
            live-check.log
          if-no-files-found: ignore
          retention-days: 7
