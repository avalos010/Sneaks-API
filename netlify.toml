[build]
  command = "npm run check"
  functions = "src"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["playwright-core"]

[dev]
  command = "npm run dev"
  targetPort = 4000
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
